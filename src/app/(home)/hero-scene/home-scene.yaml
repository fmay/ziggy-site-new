width: 500
height: 550

variables:
  - DiffY: 50
  - NumCards: 3
  - Delay: 1500

#repeat1:
steps:
# INTEGRATE
    - delay: { Delay }
      duration: { Delay }
      imageActions:
        - target: CardIntegrate
          actions:
            - moveRelative: [0, 260, 1500]
            - flip: [front, 1500]
            - fade: [0, 1500]
        - target: CardFlows, CardCluster, CardCustom
          actions:
            - moveRelative: [0, 50, 1500]

    - delay: 0
      duration: 100
      imageActions:
        - target: CardIntegrate
          actions:
            - unflip: 1
            - fade: [100, 4500]
            - move: [_, 0, 1]
            - zIndex: 0

# FLOWS
    - delay: { Delay }
      duration: { Delay }
      imageActions:
        - target: CardFlows
          actions:
            - moveRelative: [0, 260, 1500]
            - flip: [front, 1500]
            - fade: [0, 1500]
        - target: CardIntegrate, CardCluster, CardCustom
          actions:
            - moveRelative: [0, 50, 1500]

    - delay: 0
      imageActions:
        - target: CardFlows
          actions:
            - unflip: 1
            - move: [_, 0, 1]
            - fade: [100, 20]
            - zIndex: 0

