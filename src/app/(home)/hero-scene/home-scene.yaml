width: 500
height: 500

variables:
  - DiffY: 50
  - NumCards: 3
  - Delay: 1000

#repeat1:
steps:
    - delay: { Delay }
      duration: 1500
      imageActions:
        - target: CardIntegrate
          actions:
            - moveRelative: [0, 260, 1500]
            - flip: [front, 1500]
            - fade: [0, 1500]
        - target: CardFlows, CardCluster, CardCustom
          actions:
            - moveRelative: [0, 50, 1500]

