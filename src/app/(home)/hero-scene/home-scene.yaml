width: 500
height: 550

variables:
  - DiffY: 50
  - NumCards: 3
  - Delay: 1000

#repeat1:
steps:
    - delay: { Delay }
      duration: 1500
      imageActions:
        - target: CardIntegrate
          actions:
            - moveRelative: [0, 260, 1500]
            - flip: [front, 1500]
